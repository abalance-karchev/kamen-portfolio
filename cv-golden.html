<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Golden CV — A4 flat layout</title>
<style>
  :root{
    --phi: 1.6180339887;
    --sqrtphi: 1.2720196495; /* width:height of one golden rectangle */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:#888;
  }

  /* ── A4 PAGE ── */
  .page{
    width:210mm;
    height:297mm;
    background:#fff;
    position:relative;
    box-shadow:0 0 12px rgba(0,0,0,.3);
  }

  /* ── golden-cv: matched to page height, centered horizontally ──
     aspect (width:height) = sqrtphi : 2  (two golden rectangles stacked) */
  .golden-cv{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    height:100%;
    aspect-ratio: var(--sqrtphi) / 2;
    background:#eee;
  }

  /* every leaf is a flat, directly-positioned child — no nesting, hard % */
  .cell{
    position:absolute;
    background:#5e548e;
    border:2px solid #fff;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .label{
    font-family:sans-serif;
    font-weight:700;
    color:#fff;
    text-align:center;
    font-size:clamp(.5rem, 1.6vw, 1.4rem);
    letter-spacing:.5px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="golden-cv" id="golden-cv">

    <!-- ═══ SECTION 1 (top golden) — 4 groups ═══ -->
    <div class="cell" style="left:0%;       top:0%;       width:38.1966%; height:30.9017%;"><span class="label">1.2.1</span></div>
    <div class="cell" style="left:0%;       top:30.9017%; width:38.1966%; height:19.0983%;"><span class="label">1.2.2</span></div>
    <div class="cell" style="left:38.1966%; top:0%;       width:61.8034%; height:11.8034%;"><span class="label">1.1.1 (top)</span></div>
    <div class="cell" style="left:38.1966%; top:11.8034%; width:61.8034%; height:19.0983%;"><span class="label">1.1.1 (bottom)</span></div>
    <div class="cell" style="left:38.1966%; top:30.9017%; width:61.8034%; height:19.0983%;"><span class="label">1.1.2</span></div>

    <!-- ═══ SECTION 2 (bottom golden) — 6 groups ═══ -->
    <div class="cell" style="left:0%;       top:50%;      width:100%;     height:11.8034%;"><span class="label">2.1 (top)</span></div>
    <div class="cell" style="left:0%;       top:61.8034%; width:38.1966%; height:19.0983%;"><span class="label">2.1.2 (bottom)</span></div>
    <div class="cell" style="left:38.1966%; top:61.8034%; width:61.8034%; height:19.0983%;"><span class="label">2.1.1 (bottom)</span></div>
    <div class="cell" style="left:0%;       top:80.9017%; width:38.1966%; height:19.0983%;"><span class="label">2.2.2</span></div>
    <div class="cell" style="left:38.1966%; top:80.9017%; width:61.8034%; height:19.0983%;"><span class="label">2.2.1</span></div>

  </div>
</div>

</body>
</html>
