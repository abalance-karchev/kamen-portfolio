<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Golden Rectangle Layout — Phi²</title>
<style>
  :root{
    --phi: 1.6180339887;
    --sqrtphi: 1.2720196495; /* sqrt(phi) */
  }
  *{box-sizing:border-box;margin:0;padding:0;min-width:0;min-height:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ddd;
  }

  /* Container: width:height = sqrt(phi) : 2 (two golden rects stacked, sqrt(phi)-side horizontal) */
  .sheet{
    width:90vw;
    max-width:1100px;
    aspect-ratio: var(--sqrtphi) / 2;
    display:flex;
    flex-direction:column;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
    background:#fff;
  }
  .golden{
    flex:1 1 50%;
    aspect-ratio: var(--sqrtphi) / 1; /* each half is a sqrt(phi):1 rectangle */
    min-height:0;
  }
  .golden-top{ background:#2d2640; }
  .golden-bottom{
    background:#fafafa;
    border-top:2px solid #5e548e; /* the horizontal split */
  }

  /* ── the one primitive: split a rectangle into major (phi) + minor (1) ──
     orientation flips each level: .split-v = left/right, .split-h = top/bottom */
  .split{ width:100%; height:100%; display:flex; }
  .split-v{ flex-direction:row; }
  .split-h{ flex-direction:column; }
  .major{ flex:var(--phi) 1 0; }
  .minor{ flex:1 1 0; }

  /* leaf rectangle: session rule = purple bg + white border */
  .cell{
    background:#5e548e;
    border:2px solid #fff;
  }
  .label{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    font-family:sans-serif;
    font-size:clamp(.6rem, 2.2vw, 3rem);
    font-weight:700;
    color:#fff;
    letter-spacing:1px;
  }

  /* logic section: transparent wrapper, name tag top-left, groups design
     cells into one semantic unit (e.g. 1.1.1 = the title) */
  .logic{ position:relative; }
  .logic-tag{
    position:absolute;
    top:4px; left:6px;
    font-family:sans-serif;
    font-size:.8rem;
    font-weight:700;
    color:#333;
    letter-spacing:.5px;
    z-index:1;
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="golden golden-top">
    <section id="section-1" class="split split-v">

      <div id="section-1-2" class="split split-h minor">
        <div id="section-1-2-1" class="cell major"><span class="label">1.2.1</span></div>
        <div id="section-1-2-2" class="cell minor"><span class="label">1.2.2</span></div>
      </div>

      <div id="section-1-1" class="split split-h major">

        <div id="section-1-1-1" class="split split-h major logic">
          <span class="logic-tag">1.1.1</span>
          <div id="section-1-1-1-title" class="split split-v minor">
            <div id="section-1-1-1-2-2" class="cell minor"><span class="label">.2.2</span></div>
            <div id="section-1-1-1-1-2" class="cell major"><span class="label">.1.2</span></div>
          </div>
          <div id="section-1-1-1-body" class="split split-v major">
            <div id="section-1-1-1-2-1" class="cell minor"><span class="label">1.1.1.2.1</span></div>
            <div id="section-1-1-1-1-1" class="cell major"><span class="label">1.1.1.1.1</span></div>
          </div>
        </div>

        <div id="section-1-1-2" class="split split-v minor">
          <div id="section-1-1-2-2" class="cell minor"><span class="label">1.1.2.2</span></div>
          <div id="section-1-1-2-1" class="cell major"><span class="label">1.1.2.1</span></div>
        </div>

      </div>
    </section>
  </div>

  <div class="golden golden-bottom">
    <section id="section-2" class="split split-h">

      <div id="section-2-1" class="split split-v major">

        <div id="section-2-1-2" class="split split-v minor"> <!-- portrait column -->
          <div id="section-2-1-2-2" class="split split-h minor">
            <div id="section-2-1-2-2-2" class="cell minor"><span class="label">2.1.2.2.2</span></div>
            <div id="section-2-1-2-2-1" class="cell major"><span class="label">2.1.2.2.1</span></div>
          </div>
          <div id="section-2-1-2-1" class="split split-h major">
            <div id="section-2-1-2-1-2" class="cell minor"><span class="label">2.1.2.1.2</span></div>
            <div id="section-2-1-2-1-1" class="cell major"><span class="label">2.1.2.1.1</span></div>
          </div>
        </div>

        <div id="section-2-1-1" class="split split-v major">
          <div id="section-2-1-1-2" class="split split-h minor">
            <div id="section-2-1-1-2-2" class="cell minor"><span class="label">2.1.1.2.2</span></div>
            <div id="section-2-1-1-2-1" class="cell major"><span class="label">2.1.1.2.1</span></div>
          </div>
          <div id="section-2-1-1-1" class="split split-h major">
            <div id="section-2-1-1-1-2" class="cell minor"><span class="label">2.1.1.1.2</span></div>
            <div id="section-2-1-1-1-1" class="cell major"><span class="label">2.1.1.1.1</span></div>
          </div>
        </div>

      </div>

      <!-- the split-line from 2-1-2 / 2-1-1 continues straight down through 2-2 -->
      <div id="section-2-2" class="split split-v minor">
        <div id="section-2-2-2" class="split split-v minor">
          <div id="section-2-2-2-2" class="cell minor"><span class="label">2.2.2.2</span></div>
          <div id="section-2-2-2-1" class="cell major"><span class="label">2.2.2.1</span></div>
        </div>
        <div id="section-2-2-1" class="split split-v major">
          <div id="section-2-2-1-2" class="cell minor"><span class="label">2.2.1.2</span></div>
          <div id="section-2-2-1-1" class="cell major"><span class="label">2.2.1.1</span></div>
        </div>
      </div>

    </section>
  </div>
</div>

</body>
</html>
